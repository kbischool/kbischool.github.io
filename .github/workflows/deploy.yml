name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Work out the site address
        id: addr
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          if [ -f src/public/CNAME ]; then
            echo "origin=https://$(tr -d '[:space:]' < src/public/CNAME)" >> "$GITHUB_OUTPUT"; echo "base=" >> "$GITHUB_OUTPUT"
          elif [ "${REPO,,}" = "${OWNER,,}.github.io" ]; then
            echo "origin=https://${OWNER,,}.github.io" >> "$GITHUB_OUTPUT"; echo "base=" >> "$GITHUB_OUTPUT"
          else
            echo "origin=https://${OWNER,,}.github.io" >> "$GITHUB_OUTPUT"; echo "base=/${REPO}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the site
        run: npm run build
        env:
          SITE_ORIGIN: ${{ steps.addr.outputs.origin }}
          BASE_PATH: ${{ steps.addr.outputs.base }}
      - name: Check the build (broken links, manifest, service worker)
        run: npm run check
      - name: Lighthouse report (mobile, reports only, never blocks)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@12.6.2
        with:
          configPath: .lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
